image: eclipse-temurin:17-jdk

stages:
  - validate
  - build
  - distribute

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "10406996"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: android-sdk-cache
  paths:
    - android-sdk-root/
    - .gradle/

before_script:
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - chmod +x ./gradlew

build_release_apk:
  stage: build
  tags:
    - mac
  script:
    - echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
    - export KEYSTORE_PATH="${PWD}/keystore.jks"
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

distribute_to_firebase:
  stage: distribute
  tags:
    - mac
  needs:
    - build_release_apk
  script:
    - curl -sL https://firebase.tools | bash
    - echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > firebase-service-account.json
    - export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-service-account.json"
    - CLEAN_APP_ID=$(echo "$FIREBASE_APP_ID" | tr -d '[:space:]')
    - firebase appdistribution:distribute app/build/outputs/apk/release/*.apk
      --app "$CLEAN_APP_ID"
      --groups "Testers"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

validate_tag:
  stage: validate
  image: alpine:latest
  tags:
    - mac
  before_script: []
  script:
    - |
      if echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Tag is valid (Release Candidate format): $CI_COMMIT_TAG"
      elif echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Tag is valid (Final Release format): $CI_COMMIT_TAG"
      else
        echo "Error: Tag format is not valid: '$CI_COMMIT_TAG'"
        echo "Correct formats: v1.0.0 (release candidate) or v1.0.0.1 (final release)"
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_TAG'

build_tagged_release:
  stage: build
  tags:
    - mac
  needs:
    - validate_tag
  script:
    - export APP_VERSION_NAME="${CI_COMMIT_TAG#v}"
    - export APP_VERSION_CODE="$CI_PIPELINE_IID"
    - echo "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
    - export KEYSTORE_PATH="${PWD}/keystore.jks"
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG'

distribute_tagged_release_to_firebase:
  stage: distribute
  tags:
    - mac
  needs:
    - build_tagged_release
  script:
    - curl -sL https://firebase.tools | bash
    - echo "$FIREBASE_SERVICE_ACCOUNT" | base64 --decode > firebase-service-account.json
    - export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-service-account.json"
    - CLEAN_APP_ID=$(echo "$FIREBASE_APP_ID" | tr -d '[:space:]')
    - firebase appdistribution:distribute app/build/outputs/apk/release/*.apk
      --app "$CLEAN_APP_ID"
      --groups "Testers"
      --release-notes "Release ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG'