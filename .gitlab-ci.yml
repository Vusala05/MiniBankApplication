image: eclipse-temurin:17-jdk

stages:
  - validate
  - build
  - distribute

variables:
  ANDROID_COMPILE_SDK: "34"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "10406996"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: android-sdk-cache
  paths:
    - android-sdk-root/
    - .gradle/

before_script:
  - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
  - chmod +x ./gradlew

build_release_apk:
  stage: build
  tags:
    - mac
  script:
    - echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
    - export KEYSTORE_PATH="${PWD}/keystore.jks"
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

distribute_to_firebase:
  stage: distribute
  tags:
    - mac
  needs:
    - build_release_apk
  script:
    - echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > firebase-service-account.json
    - export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-service-account.json"
    - CLEAN_APP_ID=$(echo "$FIREBASE_APP_ID" | tr -d '[:space:]')
    - firebase appdistribution:distribute app/build/outputs/apk/release/*.apk
      --app "$CLEAN_APP_ID"
      --groups "Testers"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

validate_branch_name:
  stage: validate
  image: alpine:latest
  tags:
    - mac
  before_script: []
  script:
    - |
      if echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -Eq '^(dev|feature|tech|epic|release|bugfix|merge)/.+'; then
        echo "The name of branch is correct: $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      else
        echo "ERROR: The name format is incorrect: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME'"
        echo "Allowed formats: dev/*, feature/*, tech/*, epic/*, release/*, bugfix/*, merge/*"
        exit 1
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
validate_mr_target:
  stage: validate
  image: alpine:latest
  tags:
    - mac
  before_script: []
  script:
    - |
      SOURCE="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      TARGET="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      SOURCE_PREFIX="${SOURCE%%/*}"
      TARGET_PREFIX="${TARGET%%/*}"

      echo "Source branch: $SOURCE (prefix: $SOURCE_PREFIX)"
      echo "Target branch: $TARGET (prefix: $TARGET_PREFIX)"

      is_allowed=1

      if [ "$TARGET" == "master" ] || [ "$TARGET" == "main" ]; then
        if [ "$SOURCE_PREFIX" == "release" ]; then
          is_allowed=0
        else
          is_allowed=1
        fi
      else
        case "$SOURCE_PREFIX" in
          feature)
            case "$TARGET_PREFIX" in
              epic|release) is_allowed=0 ;;
            esac
            ;;
          tech)
            case "$TARGET_PREFIX" in
              epic|release) is_allowed=0 ;;
            esac
            ;;
          dev)
            case "$TARGET_PREFIX" in
              feature|tech) is_allowed=0 ;;
            esac
            ;;
          bugfix)
            case "$TARGET_PREFIX" in
              feature|tech|epic|release) is_allowed=0 ;;
            esac
            ;;
          merge)
            case "$TARGET_PREFIX" in
              feature|tech|epic|release) is_allowed=0 ;;
            esac
            ;;
          *)
            echo "WARNING: No rule defined for source prefix '$SOURCE_PREFIX'. Please review branching rules."
            ;;
        esac
      fi

      if [ "$is_allowed" -ne 0 ]; then
        echo "ERROR: MR from '$SOURCE' (prefix: $SOURCE_PREFIX) to '$TARGET' (prefix: $TARGET_PREFIX) is NOT allowed."
        echo ""
        echo "Allowed MR target rules:"
        echo "  feature/* -> epic/*, release/*"
        echo "  tech/*    -> epic/*, release/*"
        echo "  dev/*     -> feature/*, tech/*"
        echo "  bugfix/*  -> feature/*, tech/*, epic/*, release/*"
        echo "  merge/*   -> feature/*, tech/*, epic/*, release/*"
        echo "  master    -> only from release/*"
        echo ""
        echo "Explicitly disallowed flows:"
        echo "  feature/* -> feature/*, feature/* -> tech/*"
        echo "  tech/*    -> tech/*, tech/* -> feature/*"
        exit 1
      fi

      echo "MR target is valid: $SOURCE -> $TARGET"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

validate_tag:
  stage: validate
  image: alpine:latest
  tags:
    - mac
  before_script: []
  script:
    - |
      if echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Tag is valid (Release Candidate format): $CI_COMMIT_TAG"
      elif echo "$CI_COMMIT_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
        echo "Tag is valid (Final Release format): $CI_COMMIT_TAG"
      else
        echo "Error: Tag format is not valid: '$CI_COMMIT_TAG'"
        echo "Correct formats: v1.0.0 (release candidate) or v1.0.0.1 (final release)"
        exit 1
      fi
  rules:
    - if: '$CI_COMMIT_TAG'

build_tagged_release:
  stage: build
  tags:
    - mac
  needs:
    - validate_tag
  script:
    - export APP_VERSION_NAME="${CI_COMMIT_TAG#v}"
    - export APP_VERSION_CODE="$CI_PIPELINE_IID"
    - echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
    - export KEYSTORE_PATH="${PWD}/keystore.jks"
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG'

distribute_tagged_release_to_firebase:
  stage: distribute
  tags:
    - mac
  needs:
    - build_tagged_release
  script:
    - echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > firebase-service-account.json
    - export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-service-account.json"
    - CLEAN_APP_ID=$(echo "$FIREBASE_APP_ID" | tr -d '[:space:]')
    - firebase appdistribution:distribute app/build/outputs/apk/release/*.apk
      --app "$CLEAN_APP_ID"
      --groups "Testers"
      --release-notes "Release ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG'