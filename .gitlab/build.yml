build_release_apk:
  stage: build
  tags:
    - mac
  script:
    - echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
    - export KEYSTORE_PATH="${PWD}/keystore.jks"
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

build_tagged_release:
  stage: build
  tags:
    - mac
  needs:
    - validate_tag
  script:
    - export APP_VERSION_NAME="${CI_COMMIT_TAG#v}"
    - export APP_VERSION_CODE="$CI_PIPELINE_IID"
    - echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
    - export KEYSTORE_PATH="${PWD}/keystore.jks"
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_TAG'