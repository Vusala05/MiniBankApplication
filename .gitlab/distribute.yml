distribute_to_firebase:
  stage: distribute
  tags:
    - mac
  needs:
    - build_release_apk
  script:
    - echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > firebase-service-account.json
    - export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-service-account.json"
    - CLEAN_APP_ID=$(echo "$FIREBASE_APP_ID" | tr -d '[:space:]')
    - firebase appdistribution:distribute app/build/outputs/apk/release/*.apk
      --app "$CLEAN_APP_ID"
      --groups "Testers"
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

distribute_tagged_release_to_firebase:
  stage: distribute
  tags:
    - mac
  needs:
    - build_tagged_release
  script:
    - echo "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > firebase-service-account.json
    - export GOOGLE_APPLICATION_CREDENTIALS="${PWD}/firebase-service-account.json"
    - CLEAN_APP_ID=$(echo "$FIREBASE_APP_ID" | tr -d '[:space:]')
    - firebase appdistribution:distribute app/build/outputs/apk/release/*.apk
      --app "$CLEAN_APP_ID"
      --groups "Testers"
      --release-notes "Release ${CI_COMMIT_TAG}"
  rules:
    - if: '$CI_COMMIT_TAG'